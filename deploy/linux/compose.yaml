# TgBotDocs on Linux x86-64 with an NVIDIA GPU (ADR-0005): two services.
#
#   sh /absolute/checkout/deploy/linux/compose.sh <command>
#
# Host paths default to /srv/tgbotdocs and can be changed with the variables
# below (exported shell variables). This file holds no secrets: the
# application configuration and the database password are host files mounted
# read-only. See docs/operations/INSTALL_LINUX.md. Not yet built or run.
name: tgbotdocs

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/linux/Dockerfile
      args:
        LLAMA_CPP_IMAGE: ${LLAMA_CPP_IMAGE:?Set the reviewed llama.cpp base reference}
        ALLOW_UNPINNED_LLAMA_CPP_IMAGE: ${ALLOW_UNPINNED_LLAMA_CPP_IMAGE:-0}
    image: ${TGBOTDOCS_APP_IMAGE:?Set the verified application image reference}
    platform: linux/amd64
    # The bot must not be PID 1: a container init reaps children and forwards
    # signals, and supervised children exit if their parent is PID 1.
    init: true
    restart: unless-stopped
    # Startup cleans leftovers, runs migrations, and starts llama-server
    # before long polling; stopping cancels jobs and cleans up.
    stop_grace_period: 60s
    depends_on:
      db:
        condition: service_healthy
    environment:
      TGBOTDOCS_CONFIG: /config/tgbotdocs.env
    volumes:
      # External configuration (secrets included), read-only.
      - type: bind
        source: ${TGBOTDOCS_ENV_FILE:-/srv/tgbotdocs/config/tgbotdocs.env}
        target: /config/tgbotdocs.env
        read_only: true
        bind:
          create_host_path: false
      # DATA_ROOT: logs, runtime keys, and instance lock. Temporary jobs use
      # the dedicated mount below. Owned by UID/GID 10001.
      - type: bind
        source: ${TGBOTDOCS_DATA_DIR:-/srv/tgbotdocs/data}
        target: /data
        bind:
          create_host_path: false
      # Dedicated temporary mount inside DATA_ROOT (ADR-0005).
      - type: bind
        source: ${TGBOTDOCS_TEMP_DIR:-/srv/tgbotdocs/temporary}
        target: /data/temporary
        bind:
          create_host_path: false
      # Model weights and the frozen recognition configuration are pinned
      # inputs: read-only, so the application cannot alter them.
      - type: bind
        source: ${TGBOTDOCS_MODELS_DIR:-/srv/tgbotdocs/models}
        target: /data/models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TGBOTDOCS_FROZEN_DIR:-/srv/tgbotdocs/frozen}
        target: /data/frozen
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - egress
    # No published ports: long polling is outbound only, and llama-server
    # listens on the container's loopback.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  db:
    # PostgreSQL 18.6, matching the Windows development cluster (Debian trixie).
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: tgbotdocs_admin
      POSTGRES_DB: tgbotdocs
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    secrets:
      - db_password
      - db_admin_password
    # Same logging restrictions as the Windows cluster: no SQL statements or
    # parameter values (profile settings) in the server log.
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_error_verbosity=terse
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    volumes:
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/18/docker.
      - db-data:/var/lib/postgresql
      - type: bind
        source: ./init-app-role.sh
        target: /docker-entrypoint-initdb.d/10-application-role.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # TCP, so the temporary socket-only server of the first initialization
      # does not count as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -q"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - backend
    # No published ports: only the app reaches the database.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  # Database traffic only; no route outside the host.
  backend:
    internal: true
  # Outbound access for the app (Telegram Bot API).
  egress: {}

volumes:
  db-data: {}

secrets:
  db_password:
    file: ${TGBOTDOCS_DB_PASSWORD_FILE:-/srv/tgbotdocs/config/db-password}
  db_admin_password:
    file: ${TGBOTDOCS_DB_ADMIN_PASSWORD_FILE:-/srv/tgbotdocs/config/db-admin-password}
