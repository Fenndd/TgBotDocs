[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "tgbotdocs"
version = "0.1.0"
description = "Local document recognition core and Telegram application"
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpx==0.28.1",
  "Pillow==12.3.0",
  "pypdfium2==5.13.0",
  "pydantic==2.13.5",
  "psutil==7.2.2",
  "aiogram>=3,<4",
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3,<4",
  "alembic>=1,<2",
  "python-dotenv>=1,<2",
]

[project.scripts]
tgbotdocs-recognize = "tgbotdocs.recognition.runner:main"
tgbotdocs-corpus = "tgbotdocs.recognition.corpus_cli:main"
tgbotdocs-benchmark = "tgbotdocs.recognition.benchmark:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168.2",
    "pytest==9.1.1",
    "pytest-asyncio>=1.4.0",
    "reportlab==5.0.1",
    "ruff>=0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tgbotdocs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = ["runtime: requires the pinned local GPU runtime and serial execution"]

[tool.ruff]
target-version = "py314"
line-length = 110
# Exploratory T01a probes and corpus generators are not product code; corpus
# manifests record their exact bytes, so style-only edits would break provenance.
extend-exclude = ["tools/t01"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC"]
